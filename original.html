<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuhaAlifa Repairs — Repair Tracking Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ============================= TOKENS ============================= */
:root{
  --indigo:#171D8D;
  --blue:#1D53B7;
  --teal:#0FB5C8;
  --ink:#0B1220;
  --paper:#F5F7FB;
  --card:#FFFFFF;
  --line:#E3E8F1;
  --muted:#66708A;
  --muted-2:#98A2B8;
  --ok:#16A34A;
  --warn:#D97706;
  --danger:#DC2626;
  --violet:#7C3AED;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(11,18,32,.04), 0 12px 28px -12px rgba(23,29,141,.18);
  --shadow-lg:0 24px 60px -20px rgba(23,29,141,.35);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--teal);color:#fff;}
.mono{font-family:var(--font-mono);}

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible{
  outline:2px solid var(--teal); outline-offset:2px; border-radius:6px;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ============================= LAYOUT SHELL ============================= */
#app{min-height:100vh;display:flex;flex-direction:column;}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px;width:100%;}

.site-header{
  position:sticky;top:0;z-index:100;background:rgba(245,247,251,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;}
.brandmark{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:19px;}
.brandmark .glyph{width:34px;height:34px;flex:none;}
.header-actions{display:flex;align-items:center;gap:10px;}
.header-nav{display:flex;gap:22px;font-size:14px;font-weight:600;color:var(--muted);}
.header-nav a:hover{color:var(--ink);}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;
  padding:11px 20px;font-weight:600;font-size:14px;border:1px solid transparent;transition:.15s;white-space:nowrap;}
.btn-primary{background:var(--indigo);color:#fff;}
.btn-primary:hover{background:#121570;}
.btn-teal{background:var(--teal);color:#04262B;}
.btn-teal:hover{filter:brightness(.94);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--muted-2);}
.btn-sm{padding:7px 14px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;}
.btn-danger-ghost{background:transparent;color:var(--danger);border-color:#F3C4C4;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn-link{background:none;border:none;color:var(--blue);font-size:12.5px;font-weight:600;margin-top:14px;width:100%;text-align:center;}
.btn-link:hover{text-decoration:underline;}

/* ============================= HERO ============================= */
.hero{background:linear-gradient(165deg,var(--indigo) 0%, #10136B 100%);color:#fff;position:relative;overflow:hidden;}
.hero .wrap{padding:60px 20px 84px;display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center;position:relative;z-index:2;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(15,181,200,.16);border:1px solid rgba(15,181,200,.4);
  color:#7FE3EE;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:20px;}
.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.12;font-weight:700;margin-bottom:16px;}
.hero h1 em{font-style:normal;color:#7FE3EE;}
.hero p.lead{font-size:16.5px;color:#C6CBE9;max-width:460px;margin-bottom:28px;}
.track-inline{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;
  display:flex;padding:5px;gap:6px;max-width:440px;margin-bottom:14px;}
.track-inline input{flex:1;background:transparent;border:none;color:#fff;padding:10px 12px;font-size:13.5px;font-family:var(--font-mono);letter-spacing:.02em;}
.track-inline input::placeholder{color:#9AA1CF;}
.track-inline button{border-radius:8px;}
.hero-note{font-size:12.5px;color:#9AA1CF;}
.hero-stats{display:flex;gap:30px;margin-top:36px;}
.hero-stats div b{display:block;font-family:var(--font-display);font-size:22px;}
.hero-stats div span{font-size:12px;color:#9AA1CF;}

.ticket-signature-wrap{position:relative;display:flex;justify-content:center;}
.ticket-card{
  width:310px;background:#fff;color:var(--ink);border-radius:12px 12px 0 0;
  box-shadow:var(--shadow-lg);transform:rotate(1deg);padding:22px 22px 26px;position:relative;
  animation:ticket-in .5s ease both;
}
@keyframes ticket-in{from{opacity:0;transform:rotate(1deg) translateY(10px);}to{opacity:1;transform:rotate(1deg) translateY(0);}}
.ticket-card::after{
  content:"";position:absolute;left:0;right:0;bottom:-11px;height:22px;
  background-image:radial-gradient(circle at 10px 0, transparent 10px, #fff 10.5px);
  background-size:20px 22px;background-repeat:repeat-x;
}
.ticket-ribbon{position:absolute;top:18px;right:-1px;background:var(--teal);color:#04262B;font-size:10.5px;font-weight:700;
  padding:5px 10px 5px 12px;border-radius:6px 0 0 6px;letter-spacing:.02em;}
.ticket-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.5px dashed var(--line);padding-bottom:14px;margin-bottom:14px;}
.ticket-top .id-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;}
.ticket-top .id-value{font-family:var(--font-mono);font-weight:700;font-size:19px;color:var(--indigo);}
.ticket-status-pill{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;}
.ticket-row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:8px;}
.ticket-row span:first-child{color:var(--muted);}
.ticket-row span:last-child{font-weight:600;text-align:right;}
.ticket-qr-mini{width:60px;height:60px;background:repeating-linear-gradient(45deg,#0B1220 0 3px,#fff 3px 6px);border-radius:6px;margin-top:12px;opacity:.85;}

.hero::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:26px 26px;mask-image:radial-gradient(700px 500px at 25% 0%, black, transparent);
  z-index:1;
}

/* ============================= SECTIONS ============================= */
.section{padding:72px 20px;}
.section-tight{padding:52px 20px;}
.section-head{max-width:620px;margin-bottom:40px;}
.section-head .kicker{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--teal);margin-bottom:10px;}
.section-head h2{font-size:clamp(23px,2.8vw,32px);margin-bottom:12px;}
.section-head p{color:var(--muted);font-size:15px;}

.steps-row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.step-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
.step-num{font-family:var(--font-mono);font-size:12.5px;color:var(--teal);font-weight:700;margin-bottom:12px;}
.step-card h3{font-size:16.5px;margin-bottom:8px;}
.step-card p{color:var(--muted);font-size:13.5px;}

.phone-visual-band{background:var(--ink);border-radius:20px;padding:48px 40px;display:flex;align-items:center;justify-content:space-between;gap:40px;color:#fff;}
.phone-visual-band .copy{max-width:380px;}
.phone-visual-band h3{font-size:21px;margin-bottom:10px;}
.phone-visual-band p{color:#A9B0CC;font-size:14px;}
.phone-svg{flex:none;}

.trust-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.trust-stat{text-align:center;}
.trust-stat b{display:block;font-family:var(--font-display);font-size:26px;color:var(--indigo);}
.trust-stat span{font-size:12px;color:var(--muted);}

.site-footer{background:var(--ink);color:#8790AF;padding:36px 20px;margin-top:auto;}
.site-footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;font-size:12.5px;}
.site-footer .brandmark{color:#fff;font-size:14.5px;}

/* ============================= TRACK PAGE ============================= */
.track-shell{background:var(--paper);flex:1;padding:52px 20px 84px;}
.track-panel{max-width:520px;margin:0 auto;}
.track-search-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);text-align:center;}
.track-search-card h2{font-size:21px;margin-bottom:6px;}
.track-search-card p{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
.track-search-row{display:flex;gap:8px;}
.field-input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;font-family:var(--font-mono);letter-spacing:.02em;}
.field-input:focus{border-color:var(--teal);}

.status-pipeline{display:flex;flex-direction:column;gap:0;margin:24px 0;}
.pipe-step{display:flex;gap:14px;position:relative;padding-bottom:20px;}
.pipe-step:last-child{padding-bottom:0;}
.pipe-dot{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;background:var(--line);z-index:2;}
.pipe-step.done .pipe-dot{background:var(--ok);}
.pipe-step.current .pipe-dot{background:var(--teal);box-shadow:0 0 0 5px rgba(15,181,200,.2);}
.pipe-line{position:absolute;left:11.5px;top:24px;bottom:-4px;width:2px;background:var(--line);z-index:1;}
.pipe-step.done .pipe-line{background:var(--ok);}
.pipe-label b{display:block;font-size:13.5px;}
.pipe-label span{font-size:11.5px;color:var(--muted);}

.ticket-result-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-top:18px;box-shadow:var(--shadow);}
.result-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.status-badge{font-size:11px;font-weight:700;padding:5px 12px;border-radius:6px;text-transform:uppercase;letter-spacing:.02em;}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;}
.info-grid div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
.info-grid div b{font-size:13.5px;}

.empty-state{text-align:center;padding:20px 10px;color:var(--muted);}
.match-row{display:flex;justify-content:space-between;align-items:center;padding:11px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;}
.match-row:hover{background:var(--paper);}

/* ============================= STAFF APP ============================= */
.staff-shell{flex:1;display:flex;background:var(--paper);}
.staff-sidebar{width:220px;flex:none;background:var(--ink);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:4px;}
.staff-sidebar .brandmark{color:#fff;margin-bottom:24px;padding:0 8px;font-size:16px;}
.side-link{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:#A9B0CC;}
.side-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.side-link.active{background:var(--teal);color:#04262B;}
.staff-col{flex:1;display:flex;flex-direction:column;min-width:0;}
.account-bar{height:60px;flex:none;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px;}
.account-bar-left{font-weight:700;font-size:13.5px;color:var(--muted);}
.account-bar-right{display:flex;align-items:center;gap:12px;}
.avatar-chip{width:32px;height:32px;border-radius:50%;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--font-display);flex:none;}
.account-meta{display:flex;flex-direction:column;line-height:1.25;}
.account-meta b{font-size:12.5px;}
.account-meta span{font-size:10.5px;color:var(--muted);}
.staff-main{flex:1;padding:28px 34px;max-width:1080px;}
.staff-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
.staff-topbar h2{font-size:22px;}
.staff-topbar p{color:var(--muted);font-size:13px;margin-top:4px;}

.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);}
.chip.active{background:var(--indigo);border-color:var(--indigo);color:#fff;}

.ticket-list{display:grid;gap:10px;}
.ticket-row-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px 18px;display:grid;grid-template-columns:100px 1.4fr 1fr 1fr 130px 90px;gap:14px;align-items:center;}
.ticket-row-card:hover{border-color:var(--muted-2);}
.trc-id{font-family:var(--font-mono);font-weight:700;color:var(--indigo);font-size:13px;}
.trc-device b{display:block;font-size:13.5px;}
.trc-device span{font-size:11.5px;color:var(--muted);}
.trc-cust{font-size:12.5px;}
.trc-cust span{display:block;font-size:11px;color:var(--muted);}
.trc-date{font-size:12px;color:var(--muted);}
.list-head{display:grid;grid-template-columns:100px 1.4fr 1fr 1fr 130px 90px;gap:14px;padding:0 18px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-2);font-weight:700;margin-bottom:10px;}

/* form */
.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;max-width:700px;}
.form-progress{display:flex;gap:6px;margin-bottom:24px;}
.form-progress span{height:4px;flex:1;background:var(--line);border-radius:99px;}
.form-progress span.done{background:var(--teal);}
fieldset{border:none;padding:0;margin:0 0 20px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em;}
.field select,.field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;font-size:14px;}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--teal);}
.field-hint{font-size:12px;color:var(--muted-2);margin-top:5px;}
.field-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.service-option{border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:pointer;}
.service-option:hover{border-color:var(--muted-2);}
.service-option.selected{border-color:var(--teal);background:#EFFBFC;}
.service-option b{font-size:13.5px;}
.service-option span{font-size:11.5px;color:var(--muted);}
.service-price{font-family:var(--font-mono);font-weight:700;color:var(--indigo);font-size:13px;}
.form-actions{display:flex;justify-content:space-between;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
.photo-preview{margin-top:10px;position:relative;width:110px;}
.photo-preview img{width:110px;height:110px;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block;}
.photo-preview button{position:absolute;top:-8px;right:-8px;background:var(--danger);color:#fff;border:none;border-radius:99px;width:20px;height:20px;font-size:11px;line-height:1;}

.printable-ticket{width:320px;margin:0 auto;background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:20px;}
.print-shop{text-align:center;margin-bottom:14px;padding-bottom:14px;border-bottom:2px dashed var(--line);}
.print-shop b{font-family:var(--font-display);font-size:16px;}
.print-shop span{font-size:10.5px;color:var(--muted);display:block;}
.print-id{text-align:center;margin-bottom:14px;}
.print-id .lbl{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em;}
.print-id .val{font-family:var(--font-mono);font-weight:700;font-size:22px;color:var(--indigo);}
.print-qr{width:104px;height:104px;margin:0 auto 14px;}
.print-row{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-bottom:1px dotted var(--line);}
.print-disclaimer{font-size:10px;color:var(--muted-2);margin-top:12px;text-align:center;line-height:1.5;}

/* ============================= ADMIN ============================= */
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:18px;}
.stat-card span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;}
.stat-card b{display:block;font-family:var(--font-display);font-size:23px;margin-top:6px;}
.stat-card .delta{font-size:11px;color:var(--ok);font-weight:600;}

.admin-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap;}
.admin-tab{padding:10px 15px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;}
.admin-tab.active{color:var(--indigo);border-color:var(--indigo);}

.settings-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;}
.settings-card h4{font-size:14.5px;margin-bottom:4px;}
.settings-card p.help{font-size:12px;color:var(--muted);margin-bottom:16px;}

.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted-2);padding:8px 10px;border-bottom:1px solid var(--line);}
.data-table td{padding:10px 10px;border-bottom:1px solid var(--line);}
.role-pill{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:6px;background:#EEF1FA;color:var(--indigo);}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;}
.bar-row .lbl{width:130px;flex:none;color:var(--muted);}
.bar-track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;background:var(--teal);border-radius:99px;}
.bar-val{width:32px;text-align:right;font-weight:700;font-size:12px;}

.reminder-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.reminder-row b{font-size:13px;display:block;}
.reminder-row span{font-size:11.5px;color:var(--muted);}
.switch{position:relative;display:inline-block;width:38px;height:21px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:999px;transition:.2s;}
.slider:before{content:"";position:absolute;width:15px;height:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:var(--teal);}
.switch input:checked + .slider:before{transform:translateX(17px);}

/* login */
.login-shell{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,var(--indigo),#10136B);}
.login-card{background:#fff;border-radius:var(--radius);padding:32px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);}
.login-card h2{font-size:21px;margin-bottom:6px;}
.login-card p.help{color:var(--muted);font-size:13px;margin-bottom:20px;}
.login-error{background:#FDEDED;color:var(--danger);border:1px solid #F3C4C4;padding:10px 12px;border-radius:9px;font-size:12.5px;margin-bottom:14px;}
.demo-hint{margin-top:8px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:11px;color:var(--muted);line-height:1.7;}

/* Modal */

/* ---------------------------- TRACK ---------------------------- */
function pipelineHTML(currentStatus){
  if(currentStatus === "cancelled"){
    return `<div class="ticket-result-card" style="text-align:center;">
      <div class="status-badge" style="background:#DC262622;color:#DC2626">Cancelled</div>
      <p style="margin-top:10px;color:var(--muted);font-size:13px;">This repair was cancelled. Contact the shop for details.</p>
    </div>`;
  }
  const idx = STATUS_FLOW.indexOf(currentStatus);
  return `<div class="status-pipeline">
    ${STATUS_FLOW.map((s,i)=>{
      const m = STATUS_META[s];
      const cls = i < idx ? "done" : i === idx ? "current" : "";
      return `<div class="pipe-step ${cls}">
        ${i < STATUS_FLOW.length-1 ? `<div class="pipe-line"></div>` : ""}
        <div class="pipe-dot">${i<idx ? "✓" : i+1}</div>
        <div class="pipe-label"><b>${m.label}</b>${i===idx?`<span>Current stage</span>`:""}</div>
      </div>`;
    }).join("")}
  </div>`;
}

  return `

function renderQR(elId, text){
  const el = document.getElementById(elId);
  if(el && window.QRCode){ el.innerHTML=""; new QRCode(el, {text: "https://muhaalifa.app/track/"+text, width:104, height:104, colorDark:"#0B1220", colorLight:"#ffffff"}); }
}
function downloadTicket(id, format){
  const el = document.getElementById("printable-"+id);
  if(!el || !window.html2canvas){ toast("Preparing file…"); return; }
  toast("Generating "+format.toUpperCase()+"…");
  html2canvas(el, {scale:2, backgroundColor:"#ffffff"}).then(canvas=>{
    if(format === "jpg"){
      const link = document.createElement("a");
      link.download = id+".jpg";
      link.href = canvas.toDataURL("image/jpeg", 0.95);
      link.click();
    } else {
      const { jsPDF } = window.jspdf;
      const imgData = canvas.toDataURL("image/jpeg", 0.95);
      const w = canvas.width/2, h = canvas.height/2;
      const pdf = new jsPDF({unit:"pt", format:[w,h]});
      pdf.addImage(imgData, "JPEG", 0, 0, w, h);
      pdf.save(id+".pdf");
    }
    toast(format.toUpperCase()+" downloaded");
  }).catch(()=>toast("Couldn't generate file — try again"));
}

      <div class="field"><label>Contact phone</label><input value="${SETTINGS.phone}" class="mono" oninput="SETTINGS.phone=this.value"></div>
    </div>
    <div class="field"><label>Address</label><input value="${SETTINGS.address}" oninput="SETTINGS.address=this.value"></div>
    <div class="field"><label>Receipt footer text</label><input value="${SETTINGS.footer}" oninput="SETTINGS.footer=this.value"></div>
    <div class="field">
      <label>Shop logo (optional)</label>
      <input type="file" accept="image/*" onchange="handleLogoUpload(event)">
      ${ SETTINGS.logo ? `<img src="${SETTINGS.logo}" style="width:44px;height:44px;border-radius:9px;object-fit:cover;margin-top:8px;">` : `` }
    </div>
    <button class="btn btn-primary btn-sm" onclick="toast('Branding saved')">Save branding</button>
  </div>
  <div class="settings-card">
    <h4>Theme colour</h4><p class="help">Ships with NEXA's default teal accent — pick any colour to match your shop.</p>
    <div style="display:flex;align-items:center;gap:16px;">
      <input type="color" value="${SETTINGS.accent}" oninput="setAccent(this.value)" style="width:52px;height:52px;border:none;border-radius:10px;cursor:pointer;padding:0;">
      <div>
        <div class="mono" style="font-weight:700;font-size:13.5px;">${SETTINGS.accent}</div>
        <div style="font-size:11.5px;color:var(--muted);">Click the swatch to choose any colour</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:14px;">
      ${presets.map(c=>`<button style="width:34px;height:34px;border-radius:9px;background:${c};border:2px solid ${c===SETTINGS.accent?'var(--ink)':'transparent'};cursor:pointer;" onclick="setAccent('${c}')"></button>`).join("")}
    </div>
  </div>
  <div class="settings-card">
    <h4>Locations</h4><p class="help">Add branches if you operate from more than one location.</p>
    <table class="data-table"><thead><tr><th>Branch</th><th></th></tr></thead><tbody>
    ${BRANCHES.map(b=>`<tr><td>${b}</td><td><button class="btn btn-ghost btn-sm" onclick="toast('Edit branch — hook up to backend')">Edit</button></td></tr>`).join("")}
    </tbody></table>
    <button class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="toast('Add-branch form would open here')">+ Add branch</button>
  </div>`;
}
function AdminReminders(){
  return `
  <div class="settings-card">
    <h4>Reminders</h4><p class="help">Automatically notify customers by SMS or WhatsApp as their repair progresses.</p>
    <div class="reminder-row"><div><b>Ready for pickup</b><span>Sent the moment a ticket moves to "Ready for Pickup"</span></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="reminder-row"><div><b>Uncollected follow-up</b><span>Sent if a device isn't collected within 7 days of being ready</span></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="field-2col" style="margin-top:16px;">
      <div class="field"><label>Channels</label>
        <div style="display:flex;gap:16px;font-size:13px;">
          <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" checked> SMS</label>
          <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" checked> WhatsApp</label>
        </div>
      </div>
      <div class="field"><label>Follow-up after</label><input value="7 days"></div>
    </div>
    <p style="font-size:11.5px;color:var(--muted-2);margin-top:6px;">Connect an SMS/WhatsApp provider (e.g. Termii, Twilio) under Integrations to activate live sending.</p>
  </div>`;
}
function AdminView(){
  const tabs = [
    ["overview","Overview"], ["staff","Staff"], ["catalog","Pricing catalog"],
    ["branding","Branding & theme"], ["reminders","Reminders"],
  ];
  const main = `
    <div class="staff-topbar"><div><h2>Admin console</h2><p>Run the shop — staff, pricing, branding, and reports.</p></div></div>
    <div class="admin-tabs">
      ${tabs.map(([id,label])=>`<button class="admin-tab ${state.adminTab===id?'active':''}" data-action="set-admin-tab" data-tab="${id}">${label}</button>`).join("")}
    </div>
    ${ state.adminTab==='overview' ? AdminOverview()
      : state.adminTab==='staff' ? AdminStaff()
      : state.adminTab==='catalog' ? AdminCatalog()
      : state.adminTab==='branding' ? AdminBranding()
      : AdminReminders() }`;
  return StaffLayout(main);
}
window.setAccent = function(c){ SETTINGS.accent=c; document.documentElement.style.setProperty('--teal', c); render(); toast('Accent colour updated'); };

/* ---------------------------- ROOT RENDER ---------------------------- */
function render(){
  const app = document.getElementById("app");
  let html = "";
  switch(state.view){
    case "landing": html = LandingView(); break;
    case "track": html = TrackView(); break;
    case "staff-login": html = StaffLoginView(); break;
    case "staff-dashboard": html = StaffDashboardView(); break;
    case "staff-new": html = NewTicketView(); break;
    case "staff-ticket": html = StaffTicketDetailView(); break;
    case "admin": html = AdminView(); break;
    default: html = LandingView();
  }
  app.innerHTML = html + (state.showLogoutModal ? logoutModalHTML() : "");
  attachDelegatedHandlers();

  if(state.view === "staff-ticket"){
    const t = TICKETS.find(x=>x.id===state.activeTicketId);
    if(t) renderQR("qr-"+t.id, t.id);
  }
  if(state.view === "track" && state.trackedTicket){
    renderQR("qr-"+state.trackedTicket.id, state.trackedTicket.id);
  }
  if(state.view === "staff-new"){ bindNewTicketInputs(); }
  window.scrollTo({top:0});
}
function logoutModalHTML(){
  return `<div class="modal-backdrop" data-action="close-modal">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h3>Sign out?</h3>
      <p>You'll return to the staff login screen.</p>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost btn-block" data-action="close-modal">Stay signed in</button>
        <button class="btn btn-primary btn-block" data-action="confirm-logout">Sign out</button>
      </div>
    </div>
  </div>`;
}

/* ---------------------------- EVENT DELEGATION ---------------------------- */
function attachDelegatedHandlers(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.onclick = (e)=>{ e.preventDefault(); goTo(el.getAttribute("data-nav")); };
  });
  document.querySelectorAll("[data-action]").forEach(el=>{
    const action = el.getAttribute("data-action");
    el.onclick = (e)=>{ handleAction(action, el, e); };
  });
  const heroInput = document.getElementById("hero-track-input");
  if(heroInput) heroInput.oninput = (e)=>{ state.trackId = e.target.value; };
  const trackInput = document.getElementById("track-input");
  if(trackInput) trackInput.oninput = (e)=>{ state.trackId = e.target.value; };
  const searchInput = document.getElementById("ticket-search-input");
  if(searchInput) searchInput.oninput = (e)=>{ state.ticketSearch = e.target.value; renderList(); };
  const loginEmail = document.getElementById("login-email");
  if(loginEmail) loginEmail.oninput = (e)=>{ state.loginEmail = e.target.value; };
  const loginPassword = document.getElementById("login-password");
  if(loginPassword) loginPassword.oninput = (e)=>{ state.loginPassword = e.target.value; };
}
function renderList(){
  const main = document.querySelector(".staff-main");
  if(main) main.outerHTML = StaffDashboardView().match(/<main[\s\S]*<\/main>/)[0];
  attachDelegatedHandlers();
}
function goTo(view){
  if(["staff-dashboard","staff-new","staff-ticket","admin"].includes(view) && !state.session){
    setState({view:"staff-login"}); return;
  }
  setState({view});
}
function doTrack(){
  const raw = state.trackId.trim();
  const q = raw.toLowerCase();
  if(!q){ setState({trackedTicket:null, trackMatches:[]}); return; }
  const byId = TICKETS.find(t=>t.id.toLowerCase()===q);
  if(byId){ setState({trackedTicket:byId, trackMatches:[], view:"track"}); return; }
  const digits = raw.replace(/\D/g,"");
  const byPhone = digits.length>=6 ? TICKETS.filter(t=>t.custPhone.replace(/\D/g,"").includes(digits)) : [];
  if(byPhone.length===1){ setState({trackedTicket:byPhone[0], trackMatches:[], view:"track"}); }
  else if(byPhone.length>1){ setState({trackedTicket:null, trackMatches:byPhone, view:"track"}); }
  else { setState({trackedTicket:null, trackMatches:[], view:"track"}); }
}
function handleAction(action, el){
  switch(action){
    case "hero-track": doTrack(); break;
    case "do-track": doTrack(); break;
    case "select-match": {
      const m = TICKETS.find(x=>x.id===el.getAttribute("data-id"));
      setState({trackedTicket:m, trackMatches:[]});
      break;
    }
    case "toggle-demo-hint": setState({showDemoHint: !state.showDemoHint}); break;
    case "do-login": {
      const email = (state.loginEmail||"").trim().toLowerCase();
      const person = STAFF.find(s=>s.email.toLowerCase()===email);
      if(!person){ setState({loginError:"We couldn't find an account with that email."}); break; }
      setState({session:{name:person.name, role:person.role}, view:"staff-dashboard", loginError:null, loginEmail:"", loginPassword:""});
      toast(`Welcome back, ${person.name.split(" ")[0]}`);
      break;
    }
    case "ask-logout": setState({showLogoutModal:true}); break;
    case "close-modal": setState({showLogoutModal:false}); break;
    case "confirm-logout": setState({session:null, showLogoutModal:false, view:"landing"}); break;
    case "start-new-ticket": ntDraft = freshDraft(); ntDraft.__init=true; setState({view:"staff-new", newTicket:{step:0}}); break;
    case "nt-back": setState({newTicket:{step: Math.max(0,state.newTicket.step-1)}}); break;
    case "nt-next": setState({newTicket:{step: Math.min(NT_STEPS.length-1, state.newTicket.step+1)}}); break;
    case "nt-submit": {
      const chosen = SERVICES.find(s=>s.id===ntDraft.service);
      const amount = Number(ntDraft.customAmount || chosen.price || 0);
      const id = genId();
      TICKETS.unshift({
        id, brand:ntDraft.brand||"Unspecified brand", model:ntDraft.model||"Unspecified model", color:ntDraft.color||"",
        imei:ntDraft.imei, custName:ntDraft.custName||"", custPhone:ntDraft.custPhone||"",
        issue:ntDraft.issue||"", service:chosen.id, amount, paid:Number(ntDraft.paidNow||0), photo: ntDraft.photo||null,
        received:new Date().toISOString(), expected: new Date(ntDraft.expected).toISOString(),
        status:"received", tech: state.session.name,
      });
      setState({view:"staff-ticket", activeTicketId:id});
      toast(`Ticket ${id} created`);
      break;
    }
    case "set-filter": setState({ticketFilter: el.getAttribute("data-filter")}); break;
    case "open-ticket": setState({view:"staff-ticket", activeTicketId: el.getAttribute("data-id")}); break;
    case "set-status": {
      const t = TICKETS.find(x=>x.id===el.getAttribute("data-id"));
      if(t) t.status = el.getAttribute("data-status");
      render();
      toast(`${t.id} marked ${STATUS_META[t.status].label}`);
      break;
    }
    case "set-admin-tab": setState({adminTab: el.getAttribute("data-tab")}); break;
    case "dl-pdf": downloadTicket(el.getAttribute("data-id"), "pdf"); break;
    case "dl-jpg": downloadTicket(el.getAttribute("data-id"), "jpg"); break;
  }
}

render();
</script>

</html>
